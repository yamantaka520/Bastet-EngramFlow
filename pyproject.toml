[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "bastet-engramflow"
version = "0.1.0.dev0"
description = "Runtime-neutral governed memory resonance execution layer"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "Apache-2.0"}
authors = [{name = "Bastet-EngramFlow maintainers"}]

[tool.setuptools.packages.find]
where = ["src"]

[tool.unittest]
start-directory = "tests"
